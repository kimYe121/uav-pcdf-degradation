[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modality-decay"
version = "0.1.0"
description = "PCDF reproduction and unseen condition-composition generalization for UAV RGB-IR oriented detection"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3",
    "numpy",
    "opencv-python",
    "pyyaml",
    "matplotlib",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]
